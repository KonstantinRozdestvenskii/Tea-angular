<!-- Форма заказа -->
<div class="container py-5" id="form">
  <h2 class="text-center">Сделать заказ</h2>

  <div class="row justify-content-center pb-3">
    <div class="col-xl-2 col-lg-4 col-sm-6 col-12">
      <div>
        <label for="name" class="form-label">Имя</label>
        <input type="text" class="form-control" id="name">
      </div>
    </div>

    <div class="col-xl-2 col-lg-4 col-sm-6 col-12">
      <div>
        <label for="surname" class="form-label">Фамилия</label>
        <input type="text" class="form-control" id="surname">
      </div>
    </div>

    <div class="col-xl-2 col-lg-4 col-12">
      <div>
        <label for="phone" class="form-label">Телефон</label>
        <input type="text" class="form-control" id="phone">
      </div>
    </div>
  </div>

  <div class="row justify-content-center pb-3">
    <div class="col-xl-3 col-lg-6 col-12">
      <div>
        <label for="country" class="form-label">Страна</label>
        <input type="text" class="form-control" id="country">
      </div>
    </div>

    <div class="col-xl-3 col-lg-6 col-12">
      <div>
        <label for="index" class="form-label">Индекс</label>
        <input type="text" class="form-control" id="index">
      </div>
    </div>
  </div>

  <div class="row justify-content-center pb-3">
    <div class="col-xl-6 col-12">
      <div>
        <label for="addres" class="form-label">Адрес</label>
        <input type="text" class="form-control" id="addres">
      </div>
    </div>
  </div>

  <div class="row justify-content-center">
    <div class="col-xl-6 col-12">
      <a href="#" class="btn btn-primary hvr-pulse-grow" id="form-btn">
        Отправить
      </a>
    </div>
  </div>
</div>
