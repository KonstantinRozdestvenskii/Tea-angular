<div class="container py-4">
  <h2 class="text-center mb-4">{{ pageTitle }}</h2>

  <div *ngIf="!loading && products.length === 0" class="text-center fs-4 text-muted my-5">
    Ничего не найдено
  </div>

  <div class="row justify-content-center g-4 mt-4">
    <product-card class="col-12 col-md-6 col-lg-4" *ngFor="let product of products" [product]="product"></product-card>
  </div>

  <div *ngIf="loading" class="loader-bg">
    <div class="loader"></div>
  </div>
</div>
