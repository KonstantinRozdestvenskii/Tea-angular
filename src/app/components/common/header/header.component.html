<header>
  <nav class="navbar navbar-expand-lg bg-body-tertiary mb-4">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Logo</a>

      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" [routerLink]="'/'" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Главная</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" [routerLink]="'/products'" routerLinkActive="active">Каталог</a>
          </li>
        </ul>

        <form class="d-flex" role="search">
          <input
            class="form-control me-2"
            type="search"
            placeholder="Поиск чая"
            aria-label="Search"
            [(ngModel)]="searchQuery"
            name="searchQuery"
          >

          <button class="btn btn-outline-primary hvr-shutter-in-horizontal" type="submit" (click)="onSearch()">
            Найти
          </button>

          <button
            *ngIf="searchQuery"
            class="btn btn-outline-danger ms-2"
            type="button"
            (click)="onReset()">
            Сбросить
          </button>
        </form>
      </div>
    </div>
  </nav>
</header>
